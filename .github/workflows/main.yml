name: NSE Stock Auto-Update

on:
  schedule:
    # Runs at 14:45 UTC (8:15 PM IST) every Monday-Friday
    - cron: '45 14 * * 1-5'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install pandas requests gspread google-auth

      - name: Run Update Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python update_bot.py
