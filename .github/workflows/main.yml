name: Python Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Updated to v4 to fix the Node.js warning
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Updated to v5 to fix the Node.js warning
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # This is likely where your actual "exit code 1" failure is happening
    - name: Run Tests or Build
      run: |
        pytest
