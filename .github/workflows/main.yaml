name: Update NSE Stocks to Google Sheet

on:
  schedule:
    # Runs at 14:45 UTC (8:15 PM IST), Monday to Friday
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Installed your specific libraries using the correct pip setup
      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client pandas requests

      # Executing your exact file name with the GCP Secret attached
      - name: Run Python Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python update_bot.py
