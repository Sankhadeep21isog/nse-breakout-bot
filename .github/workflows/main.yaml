name: Python Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Standard repository checkout (Updated to v4 to fix Node.js 20 deprecation)
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up the Python environment (Updated to v5 to fix Node.js 20 deprecation)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install project dependencies (Fixed the pip upgrade typo)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Run your application tests or compilation steps
    - name: Run Tests
      run: |
        # If you use pytest, uncomment the line below:
        # pytest
        # Or run your main script to test if it executes without crashing:
        python -c "print('Environment configured successfully!')"
        - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add path/to/your/final_sheet.csv  # Change to your actual file path
        git diff-index --quiet HEAD || git commit -m "Automated sheet update"
        git push
