name: Python Build and Update Sheet

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# CRITICAL: Gives the workflow permission to push changes back to your repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull code into the runner environment
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Upgrade pip and install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Run your bot script to update the sheet data
    - name: Run Update Script
      run: |
        python update_bot.py

    # 5. Commit and push the updated spreadsheet back to GitHub
    - name: Commit and Push Updated Sheet
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # FIXME: Change 'final_sheet.csv' to your actual output file name if different
        git add final_sheet.csv 
        
        # Only commits and pushes if your bot actually made changes to the sheet
        git diff-index --quiet HEAD || (git commit -m "Automated sheet update [skip ci]" && git push)
